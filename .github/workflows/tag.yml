name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [major, minor, patch]
      release_type:
        description: 'Release type'
        required: true
        default: 'stable'
        type: choice
        options: [alpha, beta, stable]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
        token: ${{ secrets.GH_PAT }}
    - name: Bump version and push tag
      env:
        BUMP: ${{ inputs.bump_type }}
        RELEASE_TYPE: ${{ inputs.release_type }}
      run: |
        git fetch --tags
        LATEST=$(git tag | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta))?$' | sed 's/-.*//' | sort -V | tail -n 1)
        IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
        case "$BUMP" in
          major) NEW_TAG="$((MAJOR + 1)).0.0" ;;
          minor) NEW_TAG="$MAJOR.$((MINOR + 1)).0" ;;
          patch) NEW_TAG="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac
        if [ "$RELEASE_TYPE" != "stable" ]; then
          NEW_TAG="$NEW_TAG-$RELEASE_TYPE"
        fi
        git tag "$NEW_TAG"
        git push origin "$NEW_TAG"
